[package]
name = "mixfmt"
version = "0.2.3"
edition = "2024"
readme = "Readme.md"
license = "MIT"
repository = "https://github.com/jhunterkohler/mix/tree/master/mixfmt"
description = "MIXAL formatting"
keywords = ["assembly", "asm", "mix", "mixal"]
categories = ["command-line-utilities", "development-tools"]
homepage = "https://github.com/jhunterkohler/mix"
authors = ["J. Hunter Kohler <jhunterkohler@gmail.com>"]

[dependencies]
clap = { version = "4.5.24", features = ["derive"] }
mixlib = { version = ">=0.3,<1", path = "../mixlib" }

[dev-dependencies]
assert_cmd = "2.0.16"
tempfile = "3.15.0"
